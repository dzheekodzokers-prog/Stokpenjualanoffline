workflows:
  android-build:
    name: Build APK Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Unzip Project
        script: |
          unzip StokPenjualanOffline-Android.zip
          ls -la
      - name: Find build.gradle and Build
        script: |
          PROJECT_DIR=$(find . -name "build.gradle" -path "*/app/*" | head -1 | xargs dirname | xargs dirname)
          echo "Project found in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
    artifacts:
      - '**/app/build/outputs/apk/debug/*.apk'

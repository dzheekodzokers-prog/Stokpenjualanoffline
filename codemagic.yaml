workflows:
  android-build:
    name: Build APK Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      groups:
        - google-services
    scripts:
      - cd StokPenjualanOffline
      - gradle assembleDebug --stacktrace --warning-mode all
    artifacts:
      - StokPenjualanOffline/app/build/outputs/apk/debug/*.apk

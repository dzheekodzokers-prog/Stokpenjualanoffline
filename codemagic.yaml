workflows:
  android-build:
    name: Build APK Android
    environment:
      java: 17
    scripts:
      - name: Unzip Project
        script: unzip StokPenjualanOffline-Android.zip
      - name: Build APK
        script: |
          cd StokPenjualanOffline
          pwd
          gradle assembleDebug --stacktrace
    artifacts:
      - 'StokPenjualanOffline/app/build/outputs/apk/debug/*.apk'

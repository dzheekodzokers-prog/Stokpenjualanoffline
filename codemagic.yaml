workflows:
  android-build:
    name: Build APK Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Unzip Project
        script: |
          unzip StokPenjualanOffline-Android.zip
      - name: Build APK
        script: |
          cd StokPenjualanOffline
          gradle assembleDebug
    artifacts:
      - StokPenjualanOffline/app/build/outputs/apk/debug/*.apk

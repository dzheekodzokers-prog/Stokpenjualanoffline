workflows:
  android-build:
    name: Build APK Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Unzip Project
        script: |
          unzip StokPenjualanOffline-Android.zip
          cd StokPenjualanOffline-Android
          ls -la
      - name: Build APK
        script: |
          cd StokPenjualanOffline-Android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - StokPenjualanOffline-Android/app/build/outputs/apk/debug/*.apk

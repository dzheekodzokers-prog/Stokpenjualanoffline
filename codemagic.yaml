workflows:
  android-build:
    name: Build APK Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Unzip Project
        script: |
          unzip StokPenjualanOffline-Android.zip
          ls -la
      - name: Find Project Folder
        script: |
          cd $(find . -maxdepth 1 -type d -name "*StokPenjualan*" | head -1)
          pwd
          ls -la
      - name: Build APK
        script: |
          cd $(find . -maxdepth 1 -type d -name "*StokPenjualan*" | head -1)
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - '**/app/build/outputs/apk/debug/*.apk'
